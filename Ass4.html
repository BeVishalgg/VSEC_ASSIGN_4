<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration</title>
    
    <!-- Importing Inter Font for a clean, minimal look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Loading Tailwind CSS via CDN for rapid, responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* Custom styles to supplement Tailwind */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb; /* Light minimal gray background */
        }
        
        .input-transition {
            transition: all 0.2s ease-in-out;
        }

        /* Custom scrollbar for a polished look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <main class="w-full max-w-lg bg-white rounded-xl shadow-md border border-gray-100 overflow-hidden relative">
        
        <!-- Header Section -->
        <div class="px-8 py-6 border-b border-gray-100">
            <h1 class="text-2xl font-semibold text-gray-800">Employee Registration</h1>
            <p class="text-sm text-gray-500 mt-1">Please fill in the details below to create an account.</p>
        </div>

        <!-- Success Message Banner (Hidden by default) -->
        <div id="success-banner" class="hidden bg-green-50 border-l-4 border-green-500 p-4 mx-8 mt-6 rounded-r-md">
            <div class="flex">
                <div class="flex-shrink-0">
                    <svg class="h-5 w-5 text-green-400" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                    </svg>
                </div>
                <div class="ml-3">
                    <p class="text-sm text-green-700 font-medium">
                        Registration successful! The employee has been added.
                    </p>
                </div>
            </div>
        </div>

        <!-- Registration Form (novalidate prevents default browser tooltips) -->
        <form id="registration-form" class="p-8 space-y-5" novalidate>
            
            <!-- Full Name Field -->
            <div>
                <label for="fullName" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                <input type="text" id="fullName" name="fullName" placeholder="Rahul Sharma" 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 input-transition text-gray-800 placeholder-gray-400">
                <p id="error-fullName" class="text-xs text-red-500 mt-1 hidden"></p>
            </div>

            <!-- Email Field -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" id="email" name="email" placeholder="rahul.sharma@company.com" 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 input-transition text-gray-800 placeholder-gray-400">
                <p id="error-email" class="text-xs text-red-500 mt-1 hidden"></p>
            </div>

            <!-- Password Field -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" name="password" placeholder="Min. 8 characters" 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 input-transition text-gray-800 placeholder-gray-400">
                <p id="error-password" class="text-xs text-red-500 mt-1 hidden"></p>
                <p class="text-xs text-gray-400 mt-1">Must be at least 8 characters and contain a number.</p>
            </div>

            <!-- Phone Number Field -->
            <div>
                <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="1234567890" 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 input-transition text-gray-800 placeholder-gray-400">
                <p id="error-phone" class="text-xs text-red-500 mt-1 hidden"></p>
            </div>

            <!-- Department Selection -->
            <div>
                <label for="department" class="block text-sm font-medium text-gray-700 mb-1">Department</label>
                <select id="department" name="department" 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 input-transition text-gray-800 bg-white">
                    <option value="" disabled selected>Select a department</option>
                    <option value="engineering">Engineering</option>
                    <option value="design">Design</option>
                    <option value="hr">Human Resources</option>
                    <option value="marketing">Marketing</option>
                    <option value="sales">Sales</option>
                </select>
                <p id="error-department" class="text-xs text-red-500 mt-1 hidden"></p>
            </div>

            <!-- Submit Button -->
            <div class="pt-2">
                <button type="submit" 
                    class="w-full bg-gray-900 hover:bg-gray-800 text-white font-medium py-2.5 px-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-900 transition-colors duration-200">
                    Register Employee
                </button>
            </div>
        </form>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('registration-form');
            const successBanner = document.getElementById('success-banner');

            // Form Fields
            const nameInput = document.getElementById('fullName');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const phoneInput = document.getElementById('phone');
            const deptInput = document.getElementById('department');

            // Validation Regex patterns
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const phoneRegex = /^\d{10}$/; // Basic 10-digit validation
            const passwordNumberRegex = /\d/;

            // Helper function to show error
            const showError = (inputElement, errorMessage) => {
                const errorElement = document.getElementById(`error-${inputElement.id}`);
                inputElement.classList.remove('border-gray-300', 'focus:ring-indigo-500', 'focus:border-indigo-500');
                inputElement.classList.add('border-red-500', 'focus:ring-red-500', 'focus:border-red-500');
                
                errorElement.textContent = errorMessage;
                errorElement.classList.remove('hidden');
            };

            // Helper function to clear error
            const clearError = (inputElement) => {
                const errorElement = document.getElementById(`error-${inputElement.id}`);
                inputElement.classList.remove('border-red-500', 'focus:ring-red-500', 'focus:border-red-500');
                inputElement.classList.add('border-gray-300', 'focus:ring-indigo-500', 'focus:border-indigo-500');
                
                errorElement.textContent = '';
                errorElement.classList.add('hidden');
            };

            // Main validation function
            const validateForm = () => {
                let isValid = true;

                // Validate Name
                if (nameInput.value.trim() === '') {
                    showError(nameInput, 'Full name is required.');
                    isValid = false;
                } else if (nameInput.value.trim().length < 2) {
                    showError(nameInput, 'Name must be at least 2 characters long.');
                    isValid = false;
                } else {
                    clearError(nameInput);
                }

                // Validate Email
                if (emailInput.value.trim() === '') {
                    showError(emailInput, 'Email address is required.');
                    isValid = false;
                } else if (!emailRegex.test(emailInput.value.trim())) {
                    showError(emailInput, 'Please enter a valid email address.');
                    isValid = false;
                } else {
                    clearError(emailInput);
                }

                // Validate Password
                if (passwordInput.value === '') {
                    showError(passwordInput, 'Password is required.');
                    isValid = false;
                } else if (passwordInput.value.length < 8) {
                    showError(passwordInput, 'Password must be at least 8 characters.');
                    isValid = false;
                } else if (!passwordNumberRegex.test(passwordInput.value)) {
                    showError(passwordInput, 'Password must contain at least one number.');
                    isValid = false;
                } else {
                    clearError(passwordInput);
                }

                // Validate Phone Number
                if (phoneInput.value.trim() === '') {
                    showError(phoneInput, 'Phone number is required.');
                    isValid = false;
                } else if (!phoneRegex.test(phoneInput.value.trim().replace(/[-\s]/g, ''))) {
                    showError(phoneInput, 'Please enter a valid 10-digit phone number.');
                    isValid = false;
                } else {
                    clearError(phoneInput);
                }

                // Validate Department
                if (deptInput.value === '') {
                    showError(deptInput, 'Please select a department.');
                    isValid = false;
                } else {
                    clearError(deptInput);
                }

                return isValid;
            };

            // Handle form submission
            form.addEventListener('submit', (e) => {
                e.preventDefault(); // Prevent page reload

                // Hide banner on new submission attempt
                successBanner.classList.add('hidden');

                if (validateForm()) {
                    // In a real scenario, you would send data to a server here.
                    // For this assignment, we will display the success banner and reset.
                    
                    successBanner.classList.remove('hidden');
                    form.reset(); // Clear all fields
                    
                    // Optional: Scroll to top of form to see the success message
                    successBanner.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    
                    // Hide success banner after 5 seconds automatically
                    setTimeout(() => {
                        successBanner.classList.add('hidden');
                    }, 5000);
                }
            });

            // Add real-time validation clearing on input
            const inputs = [nameInput, emailInput, passwordInput, phoneInput, deptInput];
            inputs.forEach(input => {
                input.addEventListener('input', () => {
                    if (input.classList.contains('border-red-500')) {
                        clearError(input);
                    }
                });
            });
        });
    </script>
</body>
</html>
